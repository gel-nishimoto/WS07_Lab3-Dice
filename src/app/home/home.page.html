<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Dice</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div class="dice-container">

    <div class="dice" (click)="changeDice()">
      {{ diceNumber }}
    </div>

    <p>X: {{ x }}</p>
    <p>Y: {{ y }}</p>
    <p>Z: {{ z }}</p>

  </div>

</ion-content>
